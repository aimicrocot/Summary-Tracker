<div class="facts-memory-tracker-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Summary Tracker</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <div class="flex-container">
                <input id="fmt_auto_scan" type="checkbox" />
                <label for="fmt_auto_scan">Enable auto-scanning</label>
            </div>

            <div class="flex-container" id="fmt_scan_interval_row" style="margin-top: 8px; display: none; align-items: center;">
                <label for="fmt_scan_interval" style="margin-right: 10px;">Scan every N messages:</label>
                <input id="fmt_scan_interval"
                  class="text_bg"
                  type="number"
                  min="2"
                  disabled
                  style="width: 60px; max-width: 60px;
                  color: var(--text-color);
                  background-color: var(--input-bg-color);
                  border: 1px solid rgba(255,255,255,0.2);
                  border-radius: 4px;
                  padding: 2px;
                  text-align: center;" />
            </div>

            <div class="flex-container" style="margin-top: 8px;">
                <input id="fmt_auto_hide" type="checkbox" />
                <label for="fmt_auto_hide" style="margin-left: 5px;">Auto-hide after summarize</label>
            </div>

            <div class="flex-container" style="margin-top: 10px; display: flex; align-items: center;">
                <label for="fmt_skip_count" style="margin-right: 10px;">Leave messages (minimum 2):</label>
                <input id="fmt_skip_count" 
                       class="text_bg" 
                       type="number" 
                       min="2" 
                       style="width: 60px; 
                              color: var(--text-color); 
                              background-color: var(--input-bg-color); 
                              border: 1px solid rgba(255,255,255,0.2); 
                              border-radius: 4px; 
                              padding: 2px; 
                              text-align: center;" />
            </div>

            <div class="flex-container" style="margin-top: 10px; display: flex; align-items: center;">
                <label for="fmt_compress_after" style="margin-right: 10px;">Compress after N messages:</label>
                <input id="fmt_compress_after" 
                       class="text_bg" 
                       type="number" 
                       min="2" 
                       style="width: 60px; 
                              color: var(--text-color); 
                              background-color: var(--input-bg-color); 
                              border: 1px solid rgba(255,255,255,0.2); 
                              border-radius: 4px; 
                              padding: 2px; 
                              text-align: center;" />
            </div>

            <div class="flex-container" style="margin-top: 10px; display: flex; align-items: center;">
                <input id="fmt_use_custom_provider" type="checkbox" />
                <label for="fmt_use_custom_provider" style="margin-left: 5px;">Use custom provider for summarization</label>
            </div>
            
            <div id="fmt_custom_provider_panel" style="display:none; margin-top:10px; padding:10px; border:1px solid rgba(255,255,255,0.1); border-radius:5px;">
                <div style="margin-bottom:8px;">
                    <label for="fmt_custom_api_url" style="display:block; margin-bottom:3px; font-size:0.85em;">Endpoint URL:</label>
                    <input id="fmt_custom_api_url" class="text_bg" type="text" placeholder="https://openrouter.ai/api/v1" style="width:100%; color: var(--text-color); background-color: var(--input-bg-color); border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; padding: 4px;" />
                </div>
                <div style="margin-bottom:8px;">
                    <label for="fmt_custom_api_key" style="display:block; margin-bottom:3px; font-size:0.85em;">API Key:</label>
                    <input id="fmt_custom_api_key" class="text_bg" type="password" autocomplete="off" style="width:100%; color: var(--text-color); background-color: var(--input-bg-color); border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; padding: 4px;" />
                </div>
                <div style="margin-bottom:8px;">
                    <label for="fmt_custom_api_model" style="display:block; margin-bottom:3px; font-size:0.85em;">Model:</label>
                    <input id="fmt_custom_api_model" class="text_bg" type="text" placeholder="deepseek/deepseek-chat" style="width:100%; color: var(--text-color); background-color: var(--input-bg-color); border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; padding: 4px;" />
                </div>
                <input id="fmt_test_custom_provider" class="menu_button" type="button" value="Test Connection" />
            </div>
            
            <hr />
            
            <div style="display: flex; gap: 10px;">
                <input id="fmt_manual_scan" class="menu_button" type="button" value="Scan" />
                <input id="fmt_clear_facts" class="menu_button" type="button" value="Clear" style="background-color: #5c1d1d !important;" />
                <input id="fmt_toggle_hide" class="menu_button" type="button" value="Hide" />
            </div>

            <!-- БЛОК ФАКТОВ -->
            <div style="margin-top:15px;">
                <b>Saved facts: <span id="fmt_facts_count">0</span></b>
                <!-- <div id="fmt_facts_list" style="margin-top:10px; max-height: 200px; overflow-y: auto; border: 1px solid rgba(255,255,255,0.1); padding: 5px; border-radius: 5px;">
                    <small style="opacity:0.5;">Empty...</small>
                </div> -->
            </div>

            <!-- БЛОК SUMMARY — вставляется ПОСЛЕ блока фактов -->
            <div style="margin-top:15px;">
                <b>Summary:</b>
                <div id="fmt_summary_combined" style="margin-top:10px; border: 1px solid rgba(255,255,255,0.1); padding: 5px; border-radius: 5px;">
                    <small style="opacity:0.5;">Empty...</small>
                </div>
            </div>

        </div>
    </div>
</div>
<style>
.fmt-hidden { display: none !important; }
#fmt_scan_interval:disabled {
    background-color: var(--input-bg-color) !important;
    color: var(--text-color) !important;
    width: 60px !important;
}
</style>
